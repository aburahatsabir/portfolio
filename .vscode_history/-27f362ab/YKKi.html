<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Contact Section</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            accent: '#FF5722',       // The deep orange
                            'accent-strong': '#FF4D00',
                            'accent-soft': '#FFF3EB', // Light orange bg
                            dark: '#111111',
                            muted: '#6b6b6b',
                            bg: '#f8fafc',
                            surface: '#ffffff',
                            border: '#eaeaea'
                        }
                    },
                    animation: {
                        'float': 'float 8s ease-in-out infinite',
                        'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    },
                    boxShadow: {
                        'soft': '0 20px 60px -15px rgba(0, 0, 0, 0.05)',
                        'glow': '0 0 40px -10px rgba(255, 87, 34, 0.15)'
                    }
                }
            }
        }
    </script>
    <style>
        .modern-input {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #f8fafc;
            border: 1px solid transparent;
        }
        .modern-input:focus {
            background-color: #ffffff;
            border-color: #FF5722;
            box-shadow: 0 0 0 4px rgba(255, 87, 34, 0.1);
            outline: none;
        }
        .modern-input::placeholder {
            color: #94a3b8;
        }
        
        /* Custom scrollbar for text area */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-brand-bg text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6 font-sans">

    <!-- Section Wrapper -->
    <section class="relative w-full max-w-6xl mx-auto">
        
        <!-- Creative Background Elements (Minimalist Glows) -->
        <div class="absolute top-[-100px] left-[-100px] w-96 h-96 bg-brand-accent/5 rounded-full blur-3xl animate-float -z-10"></div>
        <div class="absolute bottom-[-50px] right-[-50px] w-80 h-80 bg-brand-accent/10 rounded-full blur-3xl animate-pulse-slow -z-10"></div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-16 items-start">
            
            <!-- Left Side: Creative Contact Info -->
            <div class="lg:col-span-5 pt-4 lg:sticky lg:top-12">
                <span class="inline-block py-1.5 px-3 rounded-lg bg-brand-accent-soft text-brand-accent text-xs font-bold tracking-widest uppercase mb-6 border border-brand-accent/20">
                    Get in touch
                </span>
                
                <h2 class="text-4xl md:text-5xl font-extrabold text-brand-dark leading-[1.1] mb-6 tracking-tight">
                    Let's discuss <br>your <span class="relative whitespace-nowrap">
                        <span class="relative z-10 text-brand-accent">next move.</span>
                        <svg class="absolute bottom-1 left-0 w-full h-3 -z-10 text-brand-accent/20" viewBox="0 0 100 10" preserveAspectRatio="none">
                            <path d="M0 5 Q 50 10 100 5" stroke="currentColor" stroke-width="8" fill="none" />
                        </svg>
                    </span>
                </h2>
                
                <p class="text-brand-muted text-lg leading-relaxed mb-10 max-w-md">
                    Whether you need to streamline operations or build reliable systems, I'm here to help you work smarter.
                </p>

                <!-- Modern Contact Grid -->
                <div class="grid grid-cols-1 gap-4">
                    
                    <!-- Location -->
                    <div class="group flex items-center p-4 rounded-2xl bg-white border border-brand-border hover:border-brand-accent/30 hover:shadow-lg hover:shadow-brand-accent/5 transition-all duration-300">
                        <div class="w-12 h-12 rounded-xl bg-brand-accent-soft flex items-center justify-center text-brand-accent group-hover:scale-110 transition-transform duration-300">
                            <i data-lucide="map-pin" class="w-5 h-5"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-xs text-brand-muted font-bold uppercase tracking-wider mb-0.5">Location</p>
                            <p class="text-brand-dark font-semibold">Gulshan, Dhaka</p>
                        </div>
                    </div>

                    <!-- Email -->
                    <a href="mailto:aburahatsabir178@gmail.com" class="group flex items-center p-4 rounded-2xl bg-white border border-brand-border hover:border-brand-accent/30 hover:shadow-lg hover:shadow-brand-accent/5 transition-all duration-300">
                        <div class="w-12 h-12 rounded-xl bg-brand-accent-soft flex items-center justify-center text-brand-accent group-hover:scale-110 transition-transform duration-300">
                            <i data-lucide="mail" class="w-5 h-5"></i>
                        </div>
                        <div class="ml-4 overflow-hidden">
                            <p class="text-xs text-brand-muted font-bold uppercase tracking-wider mb-0.5">Email</p>
                            <p class="text-brand-dark font-semibold truncate">aburahatsabir178@gmail.com</p>
                        </div>
                    </a>

                    <!-- Phone Row -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <a href="tel:+8801317874581" class="group flex items-center p-4 rounded-2xl bg-white border border-brand-border hover:border-brand-accent/30 hover:shadow-lg hover:shadow-brand-accent/5 transition-all duration-300">
                            <div class="w-10 h-10 rounded-xl bg-brand-accent-soft flex items-center justify-center text-brand-accent group-hover:scale-110 transition-transform duration-300 shrink-0">
                                <i data-lucide="phone" class="w-4 h-4"></i>
                            </div>
                            <div class="ml-3 overflow-hidden">
                                <p class="text-[10px] text-brand-muted font-bold uppercase tracking-wider mb-0.5">Phone</p>
                                <p class="text-brand-dark font-semibold text-sm truncate">+880 1317-874581</p>
                            </div>
                        </a>

                        <a href="https://wa.me/8801946734566" class="group flex items-center p-4 rounded-2xl bg-white border border-brand-border hover:border-brand-accent/30 hover:shadow-lg hover:shadow-brand-accent/5 transition-all duration-300">
                            <div class="w-10 h-10 rounded-xl bg-brand-accent-soft flex items-center justify-center text-brand-accent group-hover:scale-110 transition-transform duration-300 shrink-0">
                                <!-- Simple WhatsApp Icon SVG since Lucide might not have brand icons -->
                                <svg class="w-4 h-4 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                            </div>
                            <div class="ml-3 overflow-hidden">
                                <p class="text-[10px] text-brand-muted font-bold uppercase tracking-wider mb-0.5">WhatsApp</p>
                                <p class="text-brand-dark font-semibold text-sm truncate">+880 1946-734566</p>
                            </div>
                        </a>
                    </div>

                </div>
            </div>

            <!-- Right Side: The Creative Form -->
            <div class="lg:col-span-7">
                <div class="bg-white rounded-[2rem] p-8 md:p-10 shadow-soft border border-white/50 relative overflow-hidden group">
                    
                    <!-- Decorative Top Border Gradient -->
                    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-brand-accent/20 via-brand-accent to-brand-accent/20 opacity-80"></div>
                    
                    <!-- Subtle Glow Effect Behind Form -->
                    <div class="absolute -right-20 -top-20 w-64 h-64 bg-brand-accent/5 rounded-full blur-3xl pointer-events-none"></div>

                    <form action="#" class="space-y-6 relative z-10">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-slate-700 ml-1">Name</label>
                                <input type="text" placeholder="John Doe" class="modern-input w-full h-14 px-5 rounded-xl text-brand-dark font-medium placeholder:text-slate-400">
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-slate-700 ml-1">Subject</label>
                                <input type="text" placeholder="Project Inquiry" class="modern-input w-full h-14 px-5 rounded-xl text-brand-dark font-medium placeholder:text-slate-400">
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-sm font-bold text-slate-700 ml-1">Email Address</label>
                            <div class="relative">
                                <input type="email" placeholder="john@company.com" class="modern-input w-full h-14 px-5 rounded-xl text-brand-dark font-medium placeholder:text-slate-400">
                                <i data-lucide="at-sign" class="absolute right-5 top-4.5 w-5 h-5 text-slate-400 pointer-events-none"></i>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-sm font-bold text-slate-700 ml-1">Message</label>
                            <textarea rows="5" placeholder="Tell me about your project or how I can assist..." class="modern-input w-full p-5 rounded-xl text-brand-dark font-medium resize-none placeholder:text-slate-400"></textarea>
                        </div>

                        <div class="pt-4">
                            <button type="button" class="group/btn relative w-full h-14 rounded-xl bg-brand-dark text-white font-bold text-lg shadow-lg hover:shadow-xl hover:shadow-brand-accent/20 hover:-translate-y-1 transition-all duration-300 overflow-hidden flex items-center justify-center gap-3">
                                <span class="absolute inset-0 bg-brand-accent translate-y-full group-hover/btn:translate-y-0 transition-transform duration-300 ease-in-out"></span>
                                <span class="relative z-10 flex items-center gap-2">
                                    Send Message 
                                    <i data-lucide="send" class="w-4 h-4 group-hover/btn:translate-x-1 transition-transform"></i>
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </section>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
