<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
  --brand:#4F46E5;--brand-hover:#4338CA;--brand-light:#EEF2FF;--brand-border:#C7D2FE;
  --w:#FFFFFF;--off:#F8FAFC;--off2:#F1F5F9;
  --ink:#0F172A;--ink2:#1E293B;--ink3:#64748B;--ink4:#94A3B8;
  --ln:#E2E8F0;--ln2:#CBD5E1;
  --gm:#059669;--gbg:#ECFDF5;--gdk:#065F46;
  --rm:#DC2626;--rbg:#FEF2F2;
  --am:#D97706;--abg:#FFFBEB;
  --bm:#2563EB;--bbg:#EFF6FF;
  --serif:'Plus Jakarta Sans',system-ui,sans-serif;
  --sans:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:transparent;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;margin:0;padding:0}
  .erp-embed{font-family:var(--sans);background:var(--off);color:var(--ink);-webkit-font-smoothing:antialiased}

/* ══ LAYOUT ══ */
.app{display:flex;flex-direction:column;height:100%}
.topbar{height:48px;background:var(--w);border-bottom:1px solid var(--ln);display:flex;align-items:center;flex-shrink:0}
.tb-brand{width:228px;display:flex;align-items:center;gap:10px;padding:0 16px;border-right:1px solid var(--ln);height:100%;flex-shrink:0}
.tb-mark{width:26px;height:26px;background:var(--brand);border-radius:6px;display:flex;align-items:center;justify-content:center}
.tb-mark svg{width:13px;height:13px}
.tb-name{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink);line-height:1.2}
.tb-sub{font-family:var(--mono);font-size:9px;color:var(--ink4)}
.tb-nav{flex:1;display:flex;align-items:center;gap:4px;padding:0 16px}
.tb-bc{font-family:var(--mono);font-size:11px;color:var(--ink4)}
.tb-sep{color:var(--ln2);margin:0 4px;font-size:12px}
.tb-cur{font-family:var(--mono);font-size:11px;color:var(--ink);font-weight:500}
.tb-right{display:flex;align-items:center;gap:12px;padding:0 16px}
.tb-badge{font-family:var(--mono);font-size:9px;background:var(--rbg);color:var(--rm);padding:2px 6px;border-radius:3px;font-weight:500}
.tb-user{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.tb-avatar{width:24px;height:24px;border-radius:50%;background:var(--off2);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;color:var(--ink3)}

.body{display:flex;flex:1;overflow:hidden}

/* ══ SIDEBAR ══ */
.sb{width:228px;background:var(--w);border-right:1px solid var(--ln);flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column}
.sb-grp{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink4);padding:14px 14px 4px}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:12px;color:var(--ink3);cursor:pointer;transition:all .12s;user-select:none}
.sb-item:hover{color:var(--ink);background:var(--off)}
.sb-item.on{background:var(--ink);color:#FFFFFF;margin:1px 8px;border-radius:6px;padding:7px 10px}
.sb-dot{width:5px;height:5px;border-radius:50%;background:var(--ln2);flex-shrink:0}
.sb-item.on .sb-dot{background:rgba(255,255,255,.3)}
.sb-badge{margin-left:auto;font-family:var(--mono);font-size:9px;background:var(--rbg);color:var(--rm);padding:1px 5px;border-radius:3px}
.sb-item.on .sb-badge{background:rgba(255,255,255,.15);color:rgba(255,255,255,.7)}
.sb-hr{height:1px;background:var(--ln);margin:5px 0}
.sb-foot{margin-top:auto;padding:12px;border-top:1px solid var(--ln)}
.sb-stat{display:flex;align-items:center;gap:8px;background:var(--off);border:1px solid var(--ln);border-radius:7px;padding:8px 10px}
.sb-stat-dot{width:5px;height:5px;border-radius:50%;background:var(--gm)}
.sb-stat-txt{font-family:var(--mono);font-size:9px;color:var(--ink3)}

/* ══ MAIN ══ */
.main{flex:1;overflow-y:auto}
.pg{display:none;padding:24px 28px}
.pg.on{display:block}
.pg-head{margin-bottom:20px}
.pg-title{font-family:var(--serif);font-size:24px;color:var(--ink);line-height:1.1}
.pg-sub{font-family:var(--mono);font-size:10px;color:var(--ink4);margin-top:3px;letter-spacing:.3px}

/* ══ KPI STRIP ══ */
.kpis{display:grid;gap:10px;margin-bottom:18px}
.k4{grid-template-columns:repeat(4,1fr)}
.k5{grid-template-columns:repeat(5,1fr)}
.k3{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--w);border:1px solid var(--ln);border-radius:9px;padding:14px 16px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:9px 9px 0 0}
.k-ink::after{background:var(--ink)}.k-g::after{background:var(--gm)}.k-r::after{background:var(--rm)}.k-a::after{background:var(--am)}.k-b::after{background:var(--bm)}
.kpi-l{font-family:var(--mono);font-size:9px;color:var(--ink4);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px}
.kpi-v{font-family:var(--serif);font-size:24px;color:var(--ink);line-height:1}
.kpi-v.red{color:var(--rm)}.kpi-v.grn{color:var(--gdk)}.kpi-v.blu{color:var(--bm)}
.kpi-s{font-family:var(--mono);font-size:9px;color:var(--ink4);margin-top:4px}
.kpi-delta{font-family:var(--mono);font-size:9px;margin-top:6px}
.kpi-delta.up{color:var(--gm)}.kpi-delta.dn{color:var(--rm)}.kpi-delta.warn{color:var(--am)}

/* ══ GRID ══ */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.g13{display:grid;grid-template-columns:1fr 320px;gap:14px;margin-bottom:14px}
.g31{display:grid;grid-template-columns:320px 1fr;gap:14px;margin-bottom:14px}
.mb{margin-bottom:14px}

/* ══ CARD ══ */
.card{background:var(--w);border:1px solid var(--ln);border-radius:9px;overflow:hidden}
.ch{padding:11px 16px;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;background:var(--w)}
.ct{font-size:12px;font-weight:500;color:var(--ink)}
.cs{font-family:var(--mono);font-size:10px;color:var(--ink4)}
.cv{padding:14px 16px;position:relative}
.cv.h140{height:154px}.cv.h160{height:174px}.cv.h180{height:194px}.cv.h200{height:214px}

/* ══ TABLE ══ */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-family:var(--mono);font-size:9px;color:var(--ink4);text-transform:uppercase;letter-spacing:1px;padding:8px 12px;border-bottom:1px solid var(--ln);text-align:left;font-weight:400;background:var(--off)}
.tbl td{padding:8px 12px;font-size:11px;color:var(--ink2);border-bottom:1px solid var(--ln);font-weight:300;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--off)}
.stbl{overflow-y:auto;max-height:280px}
.m{font-family:var(--mono)}

/* ══ PILLS ══ */
.pill{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:4px;white-space:nowrap;font-weight:500}
.p-ok{background:var(--gbg);color:var(--gdk)}
.p-due{background:var(--abg);color:var(--am)}
.p-over{background:var(--rbg);color:var(--rdk)}
.p-blu{background:var(--bbg);color:var(--bm)}
.p-gray{background:var(--off2);color:var(--ink3)}
.p-adv{background:#e8f4ee;color:#065F46}

/* ══ BAR CELL ══ */
.bc{height:4px;background:var(--off2);border-radius:2px;overflow:hidden;min-width:50px}
.bf{height:100%;background:var(--brand);border-radius:2px}
.bf.g{background:var(--gm)}.bf.r{background:var(--rm)}

/* ══ LEGEND ══ */
.leg{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;justify-content:space-between}
.ll{display:flex;align-items:center;gap:8px}
.lsq{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.ln{font-size:12px;color:var(--ink2);font-weight:300}
.lv{font-family:var(--mono);font-size:11px;color:var(--ink)}
.lp{font-family:var(--mono);font-size:9px;color:var(--ink4);margin-left:3px}

/* ══ TIMELINE ══ */
.tl-item{display:flex;gap:12px;padding:10px 16px;border-bottom:1px solid var(--ln);align-items:flex-start}
.tl-item:last-child{border-bottom:none}
.tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.tl-body{flex:1;min-width:0}
.tl-t{font-size:12px;font-weight:500;color:var(--ink)}
.tl-m{font-family:var(--mono);font-size:9px;color:var(--ink4);margin:2px 0 4px}
.tl-n{font-size:11px;color:var(--ink3);line-height:1.5;font-weight:300}
.tl-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}

/* ══ ACTIVITY FEED ══ */
.af-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--ln)}
.af-item:last-child{border-bottom:none}
.af-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px}
.af-icon.ord{background:var(--bbg);color:var(--bm)}
.af-icon.pay{background:var(--gbg);color:var(--gdk)}
.af-icon.ret{background:var(--rbg);color:var(--rdk)}
.af-body{flex:1;min-width:0}
.af-t{font-size:12px;font-weight:400;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.af-m{font-family:var(--mono);font-size:9px;color:var(--ink4);margin-top:1px}
.af-amt{font-family:var(--mono);font-size:12px;white-space:nowrap;text-align:right}
.af-amt.pos{color:var(--gm)}.af-amt.neg{color:var(--rm)}.af-amt.neu{color:var(--ink3)}

/* ══ MINI STATS ══ */
.mstat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 16px}
.mstat{background:var(--off);border-radius:7px;padding:11px 13px}
.mstat-l{font-family:var(--mono);font-size:9px;color:var(--ink4);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.mstat-v{font-family:var(--serif);font-size:19px;color:var(--ink)}

/* ══ ORDER / INVOICE ══ */
.ord-shell{display:grid;grid-template-columns:1fr 380px;gap:14px}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-lbl{font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px;display:block}
input,select,textarea{border:1px solid var(--ln);border-radius:6px;font-family:var(--sans);font-size:12px;color:var(--ink);background:var(--w);outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
input[type=text],input[type=number]{width:100%;padding:7px 10px}
select{width:100%;padding:7px 10px;cursor:pointer}
.sku-wrap{border:1px solid var(--ln);border-radius:8px;overflow:hidden;margin-bottom:10px}
.sku-hd{display:grid;grid-template-columns:2fr 90px 70px 80px 28px;background:var(--off);border-bottom:1px solid var(--ln);padding:6px 12px;font-family:var(--mono);font-size:9px;color:var(--ink4);text-transform:uppercase;letter-spacing:1px}
.sku-row{display:grid;grid-template-columns:2fr 90px 70px 80px 28px;gap:5px;padding:7px 12px;border-bottom:1px solid var(--ln);align-items:center}
.sku-row:last-child{border-bottom:none}
.sku-row select,.sku-row input{padding:5px 7px;font-family:var(--mono);font-size:11px}
.del-btn{background:none;border:none;cursor:pointer;color:var(--ink4);font-size:14px;line-height:1;border-radius:3px;padding:2px 4px;width:28px;text-align:center}
.del-btn:hover{color:var(--rm);background:var(--rbg)}
.add-sku{width:100%;border:1px dashed var(--ln2);background:none;border-radius:6px;padding:7px;font-family:var(--mono);font-size:10px;color:var(--ink4);cursor:pointer;transition:all .15s}
.add-sku:hover{border-color:var(--ink);color:var(--ink)}
.save-btn{width:100%;background:var(--ink);color:#FFFFFF;border:none;border-radius:7px;padding:10px;font-family:var(--mono);font-size:11px;cursor:pointer;transition:opacity .15s;letter-spacing:.3px;margin-top:8px}
.save-btn:hover{background:var(--brand-hover)}
.toast{display:none;background:var(--gbg);border:1px solid var(--gm);border-radius:7px;padding:10px 14px;font-size:11px;color:var(--gdk);margin-top:8px;text-align:center;font-family:var(--mono)}

/* ══ INVOICE ══ */
.invoice{background:var(--w);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.inv-header{padding:18px 22px 14px;border-bottom:1px solid var(--ln);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.inv-co-name{font-family:var(--serif);font-size:20px;color:var(--ink);line-height:1;margin-bottom:4px}
.inv-co-sub{font-family:var(--mono);font-size:9px;color:var(--ink4);letter-spacing:.8px;line-height:1.6}
.inv-memo-block{text-align:right}
.inv-memo-label{font-family:var(--mono);font-size:8px;color:var(--ink4);letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
.inv-memo-num{font-family:var(--mono);font-size:17px;color:var(--ink);font-weight:500;letter-spacing:-.3px}
.inv-meta{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--ln)}
.inv-meta-col{padding:12px 18px}
.inv-meta-col:first-child{border-right:1px solid var(--ln)}
.inv-field-lbl{font-family:var(--mono);font-size:8px;color:var(--ink4);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:4px}
.inv-field-val{font-size:12px;color:var(--ink);font-weight:400;line-height:1.4}
.inv-field-sub{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:2px}
.inv-balance-strip{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--ln);background:var(--off)}
.inv-balance-cell{padding:9px 18px}
.inv-balance-cell:first-child{border-right:1px solid var(--ln)}
.inv-balance-lbl{font-family:var(--mono);font-size:8px;color:var(--ink4);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.inv-balance-val{font-size:13px;color:var(--ink)}
.inv-lines-hd{display:grid;grid-template-columns:2fr 56px 70px 78px;background:var(--off);border-bottom:1px solid var(--ln);padding:7px 18px;font-family:var(--mono);font-size:8px;color:var(--ink4);text-transform:uppercase;letter-spacing:1.2px}
.inv-lines-hd span:not(:first-child){text-align:right}
.inv-line{display:grid;grid-template-columns:2fr 56px 70px 78px;padding:9px 18px;border-bottom:1px solid var(--ln);font-size:12px;align-items:baseline}
.inv-line span:not(:first-child){font-family:var(--mono);font-size:11px;text-align:right;color:var(--ink3)}
.inv-line .p-name{color:var(--ink);font-weight:400;line-height:1.4}
.inv-line .p-total{color:var(--ink);font-weight:500}
.inv-empty{padding:20px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink4)}
.inv-totals{padding:13px 18px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--ln)}
.inv-total-row{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.inv-total-row.main{font-size:11px;color:var(--ink);padding-top:8px;margin-top:4px;border-top:1px solid var(--ln2)}
.inv-total-row.main .lbl{font-weight:500}
.inv-total-row.main .val{font-family:var(--serif);font-size:20px;color:var(--ink)}
.inv-net-bar{padding:11px 18px;display:flex;justify-content:space-between;align-items:center;background:var(--off)}
.inv-net-lbl{font-family:var(--mono);font-size:8px;color:var(--ink4);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.inv-net-val{font-family:var(--mono);font-size:12px;font-weight:500}
.inv-vol-line{font-family:var(--mono);font-size:9px;color:var(--ink4)}

/* ══ FILTERS ══ */
.frow{display:flex;align-items:center;gap:6px;padding:9px 14px;border-bottom:1px solid var(--ln);background:var(--off);flex-wrap:wrap}
.flbl{font-family:var(--mono);font-size:9px;color:var(--ink4)}
.fbtn{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:4px;border:1px solid var(--ln);background:var(--w);color:var(--ink3);cursor:pointer;transition:all .12s}
.fbtn:hover{border-color:var(--ink);color:var(--ink)}
.fbtn.on{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.srch{font-family:var(--mono);font-size:10px;border:1px solid var(--ln);border-radius:5px;padding:4px 9px;outline:none;background:var(--w);color:var(--ink);margin-left:auto;width:160px}
.srch:focus{border-color:var(--ink)}

/* ══ PRODUCT CARDS ══ */
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ln)}
.prod-card{background:var(--w);padding:16px 18px;transition:background .15s}
.prod-card:hover{background:var(--off)}
.prod-name{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:1px}
.prod-code{font-family:var(--mono);font-size:9px;color:var(--ink4);letter-spacing:.5px;margin-bottom:10px}
.prod-bar{height:3px;background:var(--off2);border-radius:2px;margin-bottom:8px;overflow:hidden}
.prod-fill{height:100%;border-radius:2px}
.prod-stats{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.prod-kg{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink)}
.prod-pct{font-family:var(--mono);font-size:10px;color:var(--ink4)}
.prod-sizes{display:flex;flex-wrap:wrap;gap:4px}
.sz{font-family:var(--mono);font-size:9px;color:var(--ink3);background:var(--off2);padding:2px 5px;border-radius:3px}

/* ══ STAFF ══ */
.staff-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.staff-card{background:var(--w);border:1px solid var(--ln);border-radius:9px;padding:14px 16px}
.staff-av{width:32px;height:32px;border-radius:50%;background:var(--off2);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--ink3);margin-bottom:10px}
.staff-name{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:1px}
.staff-role{font-family:var(--mono);font-size:9px;color:var(--ink4);letter-spacing:.5px;margin-bottom:8px}
.staff-info{font-family:var(--mono);font-size:10px;color:var(--ink3);line-height:1.7}

/* ══ ANALYTICS TABS ══ */
.atabs{display:flex;gap:2px;background:var(--off2);border-radius:7px;padding:3px;width:fit-content;margin-bottom:16px}
.atab{padding:5px 14px;border-radius:5px;font-family:var(--mono);font-size:10px;color:var(--ink3);cursor:pointer;border:none;background:transparent;transition:all .15s}
.atab.on{background:var(--w);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.07)}

/* ══ NOTE CELL ══ */
.nc{font-size:10px;color:var(--ink4);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ══ LEDGER ══ */
.ldg-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.ls{background:var(--off);border:1px solid var(--ln);border-radius:8px;padding:12px 14px}
.ls-l{font-family:var(--mono);font-size:9px;color:var(--ink4);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.ls-v{font-family:var(--serif);font-size:19px;color:var(--ink)}

t.getElementById('prod-catalog').innerHTML=SKUS.map(p=>`<div class=\"prod-card\">\n    <div class=\"prod-name\">${p.name}<\/div>\n    <div class=\"prod-code\">${p.code} \u00b7 DOHA BRAND<\/div>\n    <div class=\"prod-bar\"><div class=\"prod-fill\" style=\"width:${Math.min(100,p.kg/45785*100)}%;background:${p.color}\"><\/div><\/div>\n    <div class=\"prod-stats\"><div class=\"prod-kg\">${p.kg.toLocaleString()} kg<\/div><div class=\"prod-pct\">${p.pct}%<\/div><\/div>\n    <div class=\"prod-sizes\">${p.sizes.map((sz,i)=>`<span class=\"sz\">${sz} \u00b7 \u09f3${p.rates[i]}<\/span>`).join('')}<\/div>\n  <\/div>`).join('');\n}\nfunction renderInvSkuCards(){\n  document.getElementById('inv-sku-cards').innerHTML=SKUS.map(p=>`<div style=\"display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)\">\n    <div style=\"width:28px;height:28px;border-radius:5px;background:${p.color};flex-shrink:0\"><\/div>\n    <div style=\"flex:1\">\n      <div style=\"font-size:12px;font-weight:400;color:var(--ink)\">${p.name}<\/div>\n      <div class=\"bc\" style=\"margin-top:4px\"><div class=\"bf\" style=\"width:${Math.min(100,p.kg/45785*100)}%;background:${p.color}\"><\/div><\/div>\n    <\/div>\n    <div style=\"text-align:right\"><div class=\"m\" style=\"font-size:12px;font-weight:500\">${p.kg.toLocaleString()} kg<\/div><div class=\"m\" style=\"font-size:9px;color:var(--ink4)\">${p.pct}%<\/div><\/div>\n  <\/div>`).join('')+'<div style=\"padding-top:8px\"><\/div>';\n}\nfunction renderDispatch(data){\n  document.getElementById('disp-body').innerHTML=data.map(r=>`<tr>\n    <td class=\"m\" style=\"font-size:10px;font-weight:500\">${r.s}<\/td>\n    <td style=\"font-size:10px;white-space:nowrap\">${r.d}<\/td>\n    <td style=\"font-size:11px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">${r.dlr}<\/td>\n    <td class=\"m\" style=\"font-size:10px;color:var(--ink4)\">${r.code}<\/td>\n    <td class=\"m\">${r.ch||'\u2014'}<\/td>\n    <td class=\"m\">${r.tu||'\u2014'}<\/td>\n    <td class=\"m\">${r.co||'\u2014'}<\/td>\n    <td class=\"m\">${r.te||'\u2014'}<\/td>\n    <td class=\"m\" style=\"font-weight:500;color:var(--ink)\">${r.tot.toLocaleString()}<\/td>\n    <td class=\"m\">\u09f3${Math.round(r.val/1000)}k<\/td>\n  <\/tr>`).join('');\n}\nlet filtCode='all';\nfunction filtDisp(code,btn){\n  filtCode=code;\n  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');\n  const q=document.getElementById('disp-srch').value.toLowerCase();\n  const d=DISPATCH.filter(r=>(code==='all'||r.code===code)&&(!q||(r.s.includes(q)||r.dlr.toLowerCase().includes(q)||r.code.includes(q))));\n  renderDispatch(d);\n}\nfunction srchDisp(){\n  const q=document.getElementById('disp-srch').value.toLowerCase();\n  const d=DISPATCH.filter(r=>(filtCode==='all'||r.code===filtCode)&&(!q||(r.s.includes(q)||r.dlr.toLowerCase().includes(q)||r.code.includes(q))));\n  renderDispatch(d);\n}\nfunction renderReturns(){\n  const rc={Return:'p-blu',Damage:'p-over',Defect:'p-due',Short:'p-gray'};\n  const dc={Return:'var(--bm)',Damage:'var(--rm)',Defect:'var(--am)',Short:'#64748B'};\n  document.getElementById('ret-body').innerHTML=RETURNS.map(r=>`<tr>\n    <td class=\"m\" style=\"font-size:10px\">${r.s}<\/td>\n    <td style=\"font-size:10px;white-space:nowrap\">${r.d}<\/td>\n    <td style=\"font-size:11px\">${r.dlr}<\/td>\n    <td><span class=\"pill ${rc[r.type]||'p-gray'}\">${r.type}<\/span><\/td>\n    <td style=\"font-size:11px\">${r.prod}<\/td>\n    <td class=\"m\" style=\"font-size:10px;white-space:nowrap\">${r.qty}<\/td>\n    <td class=\"m\" style=\"font-size:10px\">${r.val}<\/td>\n    <td><span class=\"pill ${r.st==='settled'?'p-ok':'p-due'}\">${r.st==='settled'?'\u2713 Settled':'\u23f3 Pending'}<\/span><\/td>\n    <td style=\"font-size:10px;color:var(--ink4);max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">${r.n}<\/td>\n  <\/tr>`).join('');\n  document.getElementById('ret-tl').innerHTML=[...RETURNS].reverse().map(r=>`<div class=\"tl-item\">\n    <div class=\"tl-dot\" style=\"background:${dc[r.type]}\"><\/div>\n    <div class=\"tl-body\">\n      <div class=\"tl-t\">${r.dlr}<\/div>\n      <div class=\"tl-m\">${r.d} \u00b7 Memo ${r.s}<\/div>\n      <div class=\"tl-n\">${r.prod} \u00b7 ${r.qty} \u00b7 ${r.val}<\/div>\n      <div class=\"tl-tags\"><span class=\"pill ${rc[r.type]||'p-gray'}\">${r.type}<\/span><span class=\"pill ${r.st==='settled'?'p-ok':'p-due'}\">${r.st==='settled'?'\u2713 Settled':'\u23f3 Pending'}<\/span><\/div>\n    <\/div><\/div>`).join('');\n}\nfunction renderDamage(){\n  const ev=[\n    {s:'10005',d:'15 Nov 2022',dlr:'Tasneem 965',type:'Damage',prod:'Turmeric (cracked packaging)',detail:'Cracked turmeric packaging discovered on delivery. \u09f31,035 deducted from memo value and credited back to dealer.',res:'\u09f31,035 credit issued'},\n    {s:'10007',d:'27 Nov 2022',dlr:'Tasneem 965',type:'Damage',prod:'Mixed SKUs (damage goods)',detail:'Damaged goods returned from depot. Deducted from outstanding previous balance. Exact quantity not specified \u2014 estimated ~50 kg.',res:'Deducted from balance'},\n    {s:'10011',d:'24 Dec 2022',dlr:'Tasneem 965',type:'Defect',prod:'Chili Powder (production defect)',detail:'Factory production defect identified. ~43 kg of chili powder returned. Credit \u09f314,420 issued \u2014 largest single defect event in 14-month period.',res:'\u09f314,420 credit issued'},\n    {s:'10087',d:'25 Aug 2023',dlr:'Tasneem 977',type:'Pending',prod:'Chili 22.8 kg + Coriander 170 kg + Turmeric 25 kg',detail:'Three products returned post-delivery. Memo noted for settlement in next challan \u2014 pending due to dealer account issues (\u09f34,61,860 outstanding).',res:'Pending \u00b7 next challan'},\n  ];\n  const dc={Damage:'var(--rm)',Defect:'var(--am)',Pending:'var(--am)'};\n  document.getElementById('dmg-tl').innerHTML=ev.map(e=>`<div class=\"tl-item\">\n    <div class=\"tl-dot\" style=\"background:${dc[e.type]}\"><\/div>\n    <div class=\"tl-body\">\n      <div class=\"tl-t\">${e.dlr} \u2014 ${e.prod}<\/div>\n      <div class=\"tl-m\">${e.d} \u00b7 Memo ${e.s}<\/div>\n      <div class=\"tl-n\">${e.detail}<\/div>\n      <div class=\"tl-tags\"><span class=\"pill ${e.type==='Damage'?'p-over':e.type==='Pending'?'p-due':'p-due'}\">${e.type}<\/span><span class=\"pill p-gray\">${e.res}<\/span><\/div>\n    <\/div><\/div>`).join('');\n}\nfunction renderPayments(){\n  const rows=Object.values(DEALERS).flatMap(d=>d.rows.map(r=>({...r,dlr:d.name,code:Object.keys(DEALERS).find(k=>DEALERS[k]===d)}))).filter(r=>r.p>0).sort((a,b)=>b.p-a.p).slice(0,20);\n  document.getElementById('pay-body').innerHTML=rows.map(r=>`<tr>\n    <td class=\"m\" style=\"font-size:10px\">${r.s}<\/td>\n    <td style=\"font-size:10px;white-space:nowrap\">${r.d}<\/td>\n    <td style=\"font-size:11px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">${r.dlr}<\/td>\n    <td class=\"m\" style=\"font-size:10px;color:var(--ink4)\">${r.code}<\/td>\n    <td class=\"m\" style=\"color:var(--bm)\">${r.bank>0?`\u09f3${r.bank.toLocaleString()}`:'\u2014'}<\/td>\n    <td class=\"m\">${(r.p-r.bank)>0?`\u09f3${(r.p-r.bank).toLocaleString()}`:'\u2014'}<\/td>\n    <td class=\"m\" style=\"font-weight:500;color:var(--gdk)\">\u09f3${r.p.toLocaleString()}<\/td>\n    <td style=\"font-size:10px;color:var(--ink4);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">${r.n||'\u2014'}<\/td>\n  <\/tr>`).join('');\n}\nfunction renderCommissions(){\n  document.getElementById('comm-body').innerHTML=COMMISSIONS.map(c=>`<tr>\n    <td class=\"m\" style=\"font-size:10px\">${c.s}<\/td>\n    <td style=\"font-size:10px;white-space:nowrap\">${c.d}<\/td>\n    <td style=\"font-size:11px\">${c.dlr}<\/td>\n    <td class=\"m\" style=\"font-size:10px\">${c.kg!=='\u2014'?`${c.kg} kg \u00d7 \u09f3${c.rate}`:'Lump sum'}<\/td>\n    <td class=\"m\" style=\"font-weight:500;color:var(--ink)\">\u09f3${c.amt.toLocaleString()}<\/td>\n    <td style=\"font-size:10px;color:var(--ink4);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">${c.n}<\/td>\n  <\/tr>`).join('');\n}\nfunction renderAnalyticsDealers(){\n  const maxR=12981196;\n  document.getElementById('a-dlr-body').innerHTML=Object.entries(DEALERS).sort((a,b)=>b[1].rev-a[1].rev).map(([code,d])=>`<tr>\n    <td style=\"font-weight:400\">${d.name}<\/td>\n    <td class=\"m\" style=\"font-size:10px;color:var(--ink4)\">${code}<\/td>\n    <td class=\"m\">${d.orders}<\/td>\n    <td class=\"m\">\u09f3${d.rev.toLocaleString()}<\/td>\n    <td class=\"m\">${d.kg.toLocaleString()}<\/td>\n    <td class=\"m\" style=\"color:var(--gdk)\">\u09f3${d.paid.toLocaleString()}<\/td>\n    <td><div class=\"bc\"><div class=\"bf\" style=\"width:${Math.round(d.rev/maxR*100)}%\"><\/div><\/div><\/td>\n    <td>${d.due>0?`<span class=\"pill p-over\">\u09f3${d.due.toLocaleString()}<\/span>`:d.adv>0?`<span class=\"pill p-adv\">+\u09f3${d.adv.toLocaleString()}<\/span>`:'<span class=\"pill p-ok\">Cleared<\/span>'}<\/td>\n  <\/tr>`).join('');\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 ORDER ENTRY \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nlet skuN=0;\nfunction addSKU(){\n  skuN++;\n  const row=document.createElement('div');row.className='sku-row';row.id=`sk-${skuN}`;\n  row.innerHTML=`<select onchange=\"chgSKUProd(${skuN})\">${SKUS.map((s,i)=>`<option value=\"${i}\">${s.name}<\/option>`).join('')}<\/select>\n    <select id=\"ss-${skuN}\" onchange=\"chgSKUSz(${skuN})\">${SKUS[0].sizes.map((sz,i)=>`<option value=\"${i}\">${sz}<\/option>`).join('')}<\/select>\n    <input type=\"number\" id=\"sq-${skuN}\" value=\"100\" min=\"1\" oninput=\"updPrev()\"/>\n    <input type=\"number\" id=\"sr-${skuN}\" value=\"${SKUS[0].rates[0]}\" step=\"0.01\" oninput=\"updPrev()\"/>\n    <button class=\"del-btn\" onclick=\"document.getElementById('sk-${skuN}').remove();updPrev()\">\u00d7<\/button>`;\n  document.getElementById('sku-rows').appendChild(row);updPrev();\n}\nfunction chgSKUProd(id){\n  const pi=document.querySelector(`#sk-${id} select`).value;\n  const p=SKUS[pi];\n  const ss=document.getElementById(`ss-${id}`);\n  ss.innerHTML=p.sizes.map((sz,i)=>`<option value=\"${i}\">${sz}<\/option>`).join('');\n  document.getElementById(`sr-${id}`).value=p.rates[0];\n  updPrev();\n}\nfunction chgSKUSz(id){\n  const pi=document.querySelector(`#sk-${id} select`).value;\n  const si=document.getElementById(`ss-${id}`).value;\n  document.getElementById(`sr-${id}`).value=SKUS[pi].rates[si]||0;\n  updPrev();\n}\nconst DEALER_MAP={\n  '965':{name:'Tasneem Enterprises',addr:'Madhavpur Montola, Habiganj',code:'965'},\n  '971':{name:'Shaon Enterprises',addr:'Sunamganj Sadar',code:'971'},\n  '966':{name:'Nishikant Store',addr:'Pagla, Sunamganj',code:'966'},\n  '967':{name:'Sufia Enterprises',addr:'Bishwanath, Sylhet',code:'967'},\n  '968':{name:'Rubel Enterprises',addr:'Laldighi Par',code:'968'},\n  '969':{name:'Abdul Hannan & Sons',addr:'Saidpur',code:'969'},\n  '970':{name:'Ma Enterprises',addr:'Rajnagar',code:'970'},\n};\nfunction updPrev(){\n  const dv=document.getElementById('o-dlr').value;\n  const dm=DEALER_MAP[dv]||{name:'\u2014',addr:'\u2014',code:dv};\n  const dt=document.getElementById('o-date').value;\n  const mgr=document.getElementById('o-mgr').value;\n  const prevBal=parseFloat(document.getElementById('o-prevbal').value)||0;\n  const payment=parseFloat(document.getElementById('o-payment').value)||0;\n  // Invoice header\n  document.getElementById('inv-dealer').textContent=dm.name;\n  document.getElementById('inv-code').textContent=`Code: ${dm.code} \u00b7 ${dm.addr}`;\n  document.getElementById('inv-date').textContent=dt;\n  document.getElementById('inv-mgr').textContent=`SR: ${mgr}`;\n  document.getElementById('inv-prevbal').textContent=`\u09f3${prevBal.toLocaleString()}`;\n  document.getElementById('inv-payment').textContent=`\u09f3${payment.toLocaleString()}`;\n  document.getElementById('inv-prev-sub').textContent=`\u09f3${prevBal.toLocaleString()}`;\n  document.getElementById('inv-pay-sub').textContent=`\u09f3${payment.toLocaleString()}`;\n  // Lines\n  const rows=[...document.querySelectorAll('[id^=\"sk-\"]')];\n  let tot=0,totKg=0,lines='';\n  rows.forEach(row=>{\n    const id=row.id.split('-')[1];\n    const pi=row.querySelector('select')?.value||0;\n    const si=document.getElementById(`ss-${id}`)?.value||0;\n    const pn=SKUS[pi]?.name||'';\n    const sz=SKUS[pi]?.sizes[si]||'';\n    const qty=parseFloat(document.getElementById(`sq-${id}`)?.value)||0;\n    const rt=parseFloat(document.getElementById(`sr-${id}`)?.value)||0;\n    const amt=Math.round(qty*rt);\n    tot+=amt;\n    // estimate kg from size\n    const szVal=parseFloat(sz)||0;\n    const isKg=sz.toLowerCase().includes('kg');\n    const kgEst=isKg?qty*szVal:qty*szVal/1000;\n    totKg+=kgEst;\n    lines+=`<div class=\"inv-line\"><span class=\"p-name\">${pn} \u00b7 ${sz}<\/span><span>${qty}<\/span><span>\u09f3${rt.toFixed(2)}<\/span><span class=\"p-total\">\u09f3${amt.toLocaleString()}<\/span><\/div>`;\n  });\n  document.getElementById('inv-lines').innerHTML=lines||'<div class=\"inv-empty\">Add product lines to see invoice<\/div>';\n  document.getElementById('inv-total').textContent=`\u09f3${tot.toLocaleString()}`;\n  document.getElementById('inv-order-val').textContent=`\u09f3${tot.toLocaleString()}`;\n  const net=prevBal+tot-payment;\n  document.getElementById('inv-net').textContent=`\u09f3${Math.abs(net).toLocaleString()} ${net>0?'DUE':net<0?'ADVANCE':'CLEARED'}`;\n  document.getElementById('inv-net').style.color=net>0?'var(--rm)':net<0?'var(--gdk)':'var(--ink4)';\n  document.getElementById('inv-vol').textContent=`${totKg.toFixed(1)} kg estimated`;\n}\nfunction saveOrder(){\n  if(!document.querySelector('[id^=\"sk-\"]'))return;\n  const t=document.getElementById('o-toast');t.style.display='block';\n  setTimeout(()=>t.style.display='none',5000);\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 NAVIGATION \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction nav(page,sec){\n  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('on'));\n  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));\n  const el=document.querySelector(`[data-p=\"${page}\"]`);\n  if(el)el.classList.add('on');\n  const pg=document.getElementById(`pg-${page}`);\n  if(pg){pg.classList.remove('on');void pg.offsetWidth;pg.classList.add('on');}\n  document.getElementById('tb-sec').textContent=sec||'Core';\n  document.getElementById('tb-pg').textContent=el?.textContent.trim().replace(/\\d+/g,'')||page;\n  document.getElementById('main').scrollTop=0;\n}\ndocument.querySelectorAll('.sb-item[data-p]').forEach(el=>{\n  el.addEventListener('click',()=>nav(el.dataset.p,el.dataset.s));\n});\nfunction switchA(btn,id){\n  document.querySelectorAll('.atab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');\n  ['rev','vol','dlr','prd'].forEach(t=>document.getElementById(`a-${t}`).style.display=t===id?'block':'none');\n  setTimeout(()=>{\n    if(id==='vol'&&!charts['c-a-vol'])buildCharts();\n    if(id==='prd'&&!charts['c-a-prd'])buildCharts();\n  },50);\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 INIT \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nrenderDashDealers();renderActivity();renderFullDealers();\nrenderProducts();renderInvSkuCards();\nrenderDispatch(DISPATCH);renderReturns();renderDamage();\nrenderPayments();renderCommissions();renderLedger();renderAnalyticsDealers();\naddSKU();updPrev();\nsetTimeout(buildCharts,100);\n<\/div>";
})();
</script>

const CD={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#FFFFFF',borderColor:'#E2E8F0',borderWidth:1,titleColor:'#64748B',bodyColor:'#0F172A',titleFont:{family:'JetBrains Mono',size:10},bodyFont:{family:'JetBrains Mono',size:11}}}};
const SC={x:{grid:{display:false},ticks:{color:'#CBD5E1',font:{family:'JetBrains Mono',size:9},maxRotation:45},border:{display:false}},y:{grid:{color:'#F1F5F9'},ticks:{color:'#CBD5E1',font:{family:'JetBrains Mono',size:9}},border:{display:false}}};
const charts={};
function mkBar(id,lbl,data,cols,cb){
  const c=document.getElementById(id);if(!c)return;
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(c,{type:'bar',data:{labels:lbl,datasets:[{data,backgroundColor:cols,borderRadius:2,borderSkipped:false}]},options:{...CD,scales:SC,plugins:{...CD.plugins,tooltip:{...CD.plugins.tooltip,callbacks:{label:cb||(x=>`${x.raw}`)}}}}});
}
function mkLine2(id,lbl,d1,d2){
  const c=document.getElementById(id);if(!c)return;
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(c,{type:'bar',data:{labels:lbl,datasets:[
    {label:'Order Value',data:d1.map(v=>Math.round(v/1000)),backgroundColor:MK.map((_,i)=>i>=11?'#0F172A':'#E2E8F0'),borderRadius:2,borderSkipped:false},
    {label:'Payments',data:d2.map(v=>Math.round(v/1000)),backgroundColor:MK.map((_,i)=>i>=11?'#059669':'rgba(45,148,96,.3)'),borderRadius:2,borderSkipped:false},
  ]},options:{...CD,scales:{...SC,x:{...SC.x},y:{...SC.y,ticks:{...SC.y.ticks,callback:v=>`৳${v}k`}}},plugins:{...CD.plugins,legend:{display:true,position:'top',labels:{font:{family:'JetBrains Mono',size:9},color:'#64748B',boxWidth:8,padding:10}},tooltip:{...CD.plugins.tooltip,callbacks:{label:x=>` ${x.dataset.label}: ৳${x.raw}k`}}}}});
}
function mkDonut(id,lbl,data,cols){
  const c=document.getElementById(id);if(!c)return;
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(c,{type:'doughnut',data:{labels:lbl,datasets:[{data,backgroundColor:cols,borderWidth:0}]},options:{...CD,cutout:'70%'}});
}
function mkStack(id,lbl,sets){
  const c=document.getElementById(id);if(!c)return;
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(c,{type:'bar',data:{labels:lbl,datasets:sets.map(s=>({...s,stack:'s',borderRadius:0,borderSkipped:false}))},options:{...CD,scales:SC,plugins:{...CD.plugins,legend:{display:true,position:'top',labels:{font:{family:'JetBrains Mono',size:9},color:'#64748B',boxWidth:8,padding:8}}}}});
}
function mkHBar(id,lbl,data,cols){
  const c=document.getElementById(id);if(!c)return;
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(c,{type:'bar',data:{labels:lbl,datasets:[{data,backgroundColor:cols,borderRadius:2,borderSkipped:false}]},options:{...CD,indexAxis:'y',scales:{x:{...SC.x,grid:{color:'#F1F5F9'},ticks:{...SC.x.ticks,maxRotation:0,callback:v=>`৳${Math.round(v/1000)}k`}},y:{...SC.y,grid:{display:false}}},plugins:{...CD.plugins,tooltip:{...CD.plugins.tooltip,callbacks:{label:x=>` ৳${x.raw.toLocaleString()}`}}}}});
}

/* ═══════════════ ORDER ENTRY ═══════════════ */
let skuN=0;
function addSKU(){
  skuN++;
  const row=document.createElement('div');row.className='sku-row';row.id=`sk-${skuN}`;
  row.innerHTML=`<select onchange="chgSKUProd(${skuN})">${SKUS.map((s,i)=>`<option value="${i}">${s.name}</option>`).join('')}</select>
    <select id="ss-${skuN}" onchange="chgSKUSz(${skuN})">${SKUS[0].sizes.map((sz,i)=>`<option value="${i}">${sz}</option>`).join('')}</select>
    <input type="number" id="sq-${skuN}" value="100" min="1" oninput="updPrev()"/>
    <input type="number" id="sr-${skuN}" value="${SKUS[0].rates[0]}" step="0.01" oninput="updPrev()"/>
    <button class="del-btn" onclick="document.getElementById('sk-${skuN}').remove();updPrev()">×</button>`;
  document.getElementById('sku-rows').appendChild(row);updPrev();
}
function chgSKUProd(id){
  const pi=document.querySelector(`#sk-${id} select`).value;
  const p=SKUS[pi];
  const ss=document.getElementById(`ss-${id}`);
  ss.innerHTML=p.sizes.map((sz,i)=>`<option value="${i}">${sz}</option>`).join('');
  document.getElementById(`sr-${id}`).value=p.rates[0];
  updPrev();
}
function chgSKUSz(id){
  const pi=document.querySelector(`#sk-${id} select`).value;
  const si=document.getElementById(`ss-${id}`).value;
  document.getElementById(`sr-${id}`).value=SKUS[pi].rates[si]||0;
  updPrev();
}
const DEALER_MAP={
  '965':{name:'Tasneem Enterprises',addr:'Madhavpur Montola, Habiganj',code:'965'},
  '971':{name:'Shaon Enterprises',addr:'Sunamganj Sadar',code:'971'},
  '966':{name:'Nishikant Store',addr:'Pagla, Sunamganj',code:'966'},
  '967':{name:'Sufia Enterprises',addr:'Bishwanath, Sylhet',code:'967'},
  '968':{name:'Rubel Enterprises',addr:'Laldighi Par',code:'968'},
  '969':{name:'Abdul Hannan & Sons',addr:'Saidpur',code:'969'},
  '970':{name:'Ma Enterprises',addr:'Rajnagar',code:'970'},
};
function updPrev(){
  const dv=document.getElementById('o-dlr').value;
  const dm=DEALER_MAP[dv]||{name:'—',addr:'—',code:dv};
  const dt=document.getElementById('o-date').value;
  const mgr=document.getElementById('o-mgr').value;
  const prevBal=parseFloat(document.getElementById('o-prevbal').value)||0;
  const payment=parseFloat(document.getElementById('o-payment').value)||0;
  // Invoice header
  document.getElementById('inv-dealer').textContent=dm.name;
  document.getElementById('inv-code').textContent=`Code: ${dm.code} · ${dm.addr}`;
  document.getElementById('inv-date').textContent=dt;
  document.getElementById('inv-mgr').textContent=`SR: ${mgr}`;
  document.getElementById('inv-prevbal').textContent=`৳${prevBal.toLocaleString()}`;
  document.getElementById('inv-payment').textContent=`৳${payment.toLocaleString()}`;
  document.getElementById('inv-prev-sub').textContent=`৳${prevBal.toLocaleString()}`;
  document.getElementById('inv-pay-sub').textContent=`৳${payment.toLocaleString()}`;
  // Lines
  const rows=[...document.querySelectorAll('[id^="sk-"]')];
  let tot=0,totKg=0,lines='';
  rows.forEach(row=>{
    const id=row.id.split('-')[1];
    const pi=row.querySelector('select')?.value||0;
    const si=document.getElementById(`ss-${id}`)?.value||0;
    const pn=SKUS[pi]?.name||'';
    const sz=SKUS[pi]?.sizes[si]||'';
    const qty=parseFloat(document.getElementById(`sq-${id}`)?.value)||0;
    const rt=parseFloat(document.getElementById(`sr-${id}`)?.value)||0;
    const amt=Math.round(qty*rt);
    tot+=amt;
    // estimate kg from size
    const szVal=parseFloat(sz)||0;
    const isKg=sz.toLowerCase().includes('kg');
    const kgEst=isKg?qty*szVal:qty*szVal/1000;
    totKg+=kgEst;
    lines+=`<div class="inv-line"><span class="p-name">${pn} · ${sz}</span><span>${qty}</span><span>৳${rt.toFixed(2)}</span><span class="p-total">৳${amt.toLocaleString()}</span></div>`;
  });
  document.getElementById('inv-lines').innerHTML=lines||'<div class="inv-empty">Add product lines to see invoice</div>';
  document.getElementById('inv-total').textContent=`৳${tot.toLocaleString()}`;
  document.getElementById('inv-order-val').textContent=`৳${tot.toLocaleString()}`;
  const net=prevBal+tot-payment;
  document.getElementById('inv-net').textContent=`৳${Math.abs(net).toLocaleString()} ${net>0?'DUE':net<0?'ADVANCE':'CLEARED'}`;
  document.getElementById('inv-net').style.color=net>0?'var(--rm)':net<0?'var(--gdk)':'var(--ink4)';
  document.getElementById('inv-vol').textContent=`${totKg.toFixed(1)} kg estimated`;
}
function saveOrder(){
  if(!document.querySelector('[id^="sk-"]'))return;
  const t=document.getElementById('o-toast');t.style.display='block';
  setTimeout(()=>t.style.display='none',5000);
}

/* ═══════════════ NAVIGATION ═══════════════ */
function nav(page,sec){
  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('on'));
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  const el=document.querySelector(`[data-p="${page}"]`);
  if(el)el.classList.add('on');
  const pg=document.getElementById(`pg-${page}`);
  if(pg){pg.classList.remove('on');void pg.offsetWidth;pg.classList.add('on');}
  document.getElementById('tb-sec').textContent=sec||'Core';
  document.getElementById('tb-pg').textContent=el?.textContent.trim().replace(/\d+/g,'')||page;
  document.getElementById('main').scrollTop=0;
}
document.querySelectorAll('.sb-item[data-p]').forEach(el=>{
  el.addEventListener('click',()=>nav(el.dataset.p,el.dataset.s));
});
function switchA(btn,id){
  document.querySelectorAll('.atab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  ['rev','vol','dlr','prd'].forEach(t=>document.getElementById(`a-${t}`).style.display=t===id?'block':'none');
  setTimeout(()=>{
    if(id==='vol'&&!charts['c-a-vol'])buildCharts();
    if(id==='prd'&&!charts['c-a-prd'])buildCharts();
  },50);
}
