  <circle cx="668" cy="475" r="14" fill="#9B7BFF"/>
  <circle cx="650" cy="512" r="14" fill="#FFB38A"/><circle cx="668" cy="512" r="14" fill="#FF8F8F" stroke="#FFFFFF" stroke-width="3"/>

