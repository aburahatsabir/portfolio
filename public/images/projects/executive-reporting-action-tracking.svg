  <path d="M284 318 C305 304, 312 280, 330 278 S360 298, 376 293 S404 240, 422 238 S450 258, 468 254 S496 202, 514 198 S550 182, 572 180" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="514" y1="198" x2="514" y2="338" stroke="#C9CEF5" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
