  <circle cx="420" cy="38" r="9" fill="url(#accent)" opacity="0.85"/>
  <circle cx="752" cy="330" r="7" fill="url(#warm)" opacity="0.9"/>
  <circle cx="50" cy="250" r="6" fill="#B9BEEA"/>
