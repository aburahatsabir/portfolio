<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF0FF"/>
      <stop offset="1" stop-color="#FDEBE3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C7BFF"/>
      <stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB38A"/>
      <stop offset="1" stop-color="#FF8F8F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5A5FA8" flood-opacity="0.2"/>
    </filter>
    <filter id="shadowSm" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#5A5FA8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="700" cy="70" r="150" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="70" cy="540" r="130" fill="#FFFFFF" opacity="0.4"/>

  <!-- shelf feet -->
  <rect x="170" y="516" width="44" height="22" rx="8" fill="#D3D8F7"/>
  <rect x="426" y="516" width="44" height="22" rx="8" fill="#D3D8F7"/>

  <!-- shelf frame -->
  <g filter="url(#shadow)">
    <rect x="110" y="90" width="420" height="430" rx="34" fill="#FFFFFF"/>
  </g>
  <rect x="134" y="114" width="372" height="382" rx="22" fill="#F5F6FF"/>

  <!-- shelf 1 items -->
  <rect x="156" y="156" width="92" height="70" rx="12" fill="url(#accent)"/>
  <rect x="190" y="156" width="24" height="70" fill="#FFFFFF" opacity="0.25"/>
  <rect x="166" y="200" width="18" height="10" rx="3" fill="#FFFFFF" opacity="0.6"/>
  <rect x="262" y="176" width="70" height="50" rx="10" fill="#C7B8FF"/>
  <rect x="285" y="176" width="22" height="50" fill="#FFFFFF" opacity="0.35"/>
  <rect x="346" y="140" width="58" height="86" rx="12" fill="#B9A6FF"/>
  <rect x="366" y="140" width="18" height="86" fill="#FFFFFF" opacity="0.3"/>
  <rect x="418" y="188" width="60" height="38" rx="10" fill="url(#warm)"/>
  <rect x="438" y="188" width="20" height="38" fill="#FFFFFF" opacity="0.3"/>
  <rect x="134" y="226" width="372" height="14" rx="7" fill="#DCE0FF"/>

  <!-- shelf 2 items -->
  <rect x="156" y="264" width="116" height="74" rx="12" fill="#FFFFFF" stroke="#B9BEEA" stroke-width="5"/>
  <rect x="172" y="282" width="50" height="9" rx="4.5" fill="url(#accent)"/>
  <rect x="172" y="300" width="80" height="7" rx="3.5" fill="#D9DCF2"/>
  <rect x="172" y="314" width="56" height="7" rx="3.5" fill="#D9DCF2"/>
  <rect x="206" y="340" width="16" height="10" fill="#B9BEEA"/>
  <rect x="188" y="346" width="52" height="10" rx="5" fill="#B9BEEA"/>
  <g stroke-width="6" stroke-linecap="round">
