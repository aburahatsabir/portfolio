    <line x1="322" y1="314" x2="324" y2="280" stroke="#C7B8FF"/>
    <line x1="332" y1="314" x2="342" y2="286" stroke="#6C7BFF"/>
  </g>
  <rect x="300" y="312" width="44" height="44" rx="12" fill="url(#accent)"/>
  <rect x="382" y="304" width="80" height="18" rx="7" fill="#FFD2BD"/>
  <rect x="372" y="322" width="100" height="34" rx="8" fill="#FFFFFF"/>
  <rect x="386" y="333" width="50" height="6" rx="3" fill="#D9DCF2"/>
  <rect x="386" y="343" width="30" height="5" rx="2.5" fill="#D9DCF2"/>
  <rect x="134" y="356" width="372" height="14" rx="7" fill="#DCE0FF"/>

  <!-- shelf 3 items -->
  <rect x="156" y="402" width="112" height="80" rx="14" fill="#C7B8FF"/>
  <rect x="200" y="402" width="24" height="80" fill="#FFFFFF" opacity="0.35"/>
  <rect x="166" y="456" width="22" height="10" rx="3" fill="#FFFFFF" opacity="0.7"/>
  <rect x="282" y="424" width="104" height="58" rx="12" fill="url(#accent)"/>
  <rect x="322" y="424" width="24" height="58" fill="#FFFFFF" opacity="0.25"/>
  <rect x="402" y="412" width="88" height="70" rx="14" fill="#FFF3EC" stroke="#FF9A7A" stroke-width="4" stroke-dasharray="9 9" stroke-linecap="round"/>
