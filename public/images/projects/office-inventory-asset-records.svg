  <!-- dots -->
  <circle cx="470" cy="46" r="9" fill="url(#accent)" opacity="0.85"/>
  <circle cx="760" cy="330" r="7" fill="url(#warm)" opacity="0.9"/>
  <circle cx="56" cy="230" r="6" fill="#B9BEEA"/>
  <circle cx="740" cy="560" r="12" fill="#C7B8FF" opacity="0.9"/>
</svg>
