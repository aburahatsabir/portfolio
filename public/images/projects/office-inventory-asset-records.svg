  <g transform="translate(588 336) rotate(7)" filter="url(#shadow)">
    <rect width="132" height="158" rx="26" fill="#FFFFFF"/>
    <circle cx="66" cy="18" r="6" fill="#EEF0FF"/>
    <g fill="none" stroke="url(#accent)" stroke-width="5">
