      <rect x="86" y="86" width="10" height="10" rx="3"/>
      <rect x="77" y="100" width="10" height="10" rx="3"/>
      <rect x="92" y="104" width="8" height="8" rx="2.5" fill="#C7B8FF"/>
      <rect x="58" y="60" width="6" height="6" rx="2" fill="#C7B8FF"/>
