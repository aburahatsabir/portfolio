      <rect x="68.5" y="40.5" width="30" height="30" rx="6"/>
      <rect x="24.5" y="84.5" width="30" height="30" rx="6"/>
    </g>
    <g fill="#6C7BFF">
      <rect x="35" y="51" width="10" height="10" rx="3"/>
      <rect x="79" y="51" width="10" height="10" rx="3"/>
      <rect x="35" y="95" width="10" height="10" rx="3"/>
    </g>
    <g fill="#9B7BFF">
