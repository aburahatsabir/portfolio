  <rect x="576" y="132" width="28" height="28" rx="9" fill="url(#accent)"/>
  <rect x="616" y="140" width="110" height="12" rx="6" fill="#EEF0FF"/>
  <rect x="616" y="140" width="98" height="12" rx="6" fill="url(#accent)"/>
  <rect x="576" y="181" width="28" height="28" rx="9" fill="#C7B8FF"/>
  <rect x="616" y="189" width="110" height="12" rx="6" fill="#EEF0FF"/>
  <rect x="616" y="189" width="68" height="12" rx="6" fill="#C7B8FF"/>
  <rect x="576" y="230" width="28" height="28" rx="9" fill="url(#warm)"/>
  <rect x="616" y="238" width="110" height="12" rx="6" fill="#EEF0FF"/>
  <rect x="616" y="238" width="24" height="12" rx="6" fill="url(#warm)"/>

