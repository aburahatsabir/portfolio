<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF0FF"/>
      <stop offset="1" stop-color="#FDEBE3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C7BFF"/>
      <stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB38A"/>
      <stop offset="1" stop-color="#FF8F8F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5A5FA8" flood-opacity="0.18"/>
    </filter>
    <filter id="shadowSm" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5A5FA8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- soft background shapes -->
  <circle cx="680" cy="90" r="150" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="90" cy="520" r="120" fill="#FFFFFF" opacity="0.4"/>

  <!-- back card (calendar) -->
  <g filter="url(#shadowSm)">
    <rect x="470" y="90" width="230" height="200" rx="28" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <rect x="470" y="90" width="230" height="56" rx="28" fill="url(#accent)"/>
  <rect x="470" y="118" width="230" height="28" fill="url(#accent)"/>
  <g fill="#E4E7FF">
    <circle cx="512" cy="186" r="9"/><circle cx="556" cy="186" r="9"/><circle cx="600" cy="186" r="9"/><circle cx="644" cy="186" r="9"/>
    <circle cx="512" cy="226" r="9"/><circle cx="556" cy="226" r="9"/><circle cx="644" cy="226" r="9"/>
    <circle cx="512" cy="262" r="9"/><circle cx="556" cy="262" r="9"/><circle cx="600" cy="262" r="9"/>
  </g>
  <circle cx="600" cy="226" r="13" fill="url(#warm)"/>
  <circle cx="644" cy="262" r="9" fill="#6C7BFF"/>

  <!-- main tracker card -->
  <g filter="url(#shadow)">
    <rect x="120" y="170" width="400" height="330" rx="36" fill="#FFFFFF"/>
  </g>
  <!-- header bar -->
  <rect x="160" y="210" width="120" height="16" rx="8" fill="#2B2D42"/>
  <rect x="160" y="238" width="70" height="10" rx="5" fill="#D9DCF2"/>
  <circle cx="478" cy="224" r="20" fill="#EEF0FF"/>
  <circle cx="478" cy="224" r="8" fill="url(#accent)"/>

  <!-- row 1 (done) -->
  <rect x="152" y="280" width="336" height="60" rx="20" fill="#F5F6FF"/>
  <circle cx="186" cy="310" r="15" fill="url(#accent)"/>
  <path d="M179 310 l5 5 l10 -11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="216" y="301" width="160" height="10" rx="5" fill="#B9BEEA"/>
  <rect x="216" y="318" width="90" height="8" rx="4" fill="#D9DCF2"/>
  <rect x="420" y="302" width="48" height="18" rx="9" fill="#DCE0FF"/>

  <!-- row 2 (done) -->
  <rect x="152" y="354" width="336" height="60" rx="20" fill="#F5F6FF"/>
  <circle cx="186" cy="384" r="15" fill="url(#accent)"/>
  <path d="M179 384 l5 5 l10 -11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="216" y="375" width="130" height="10" rx="5" fill="#B9BEEA"/>
  <rect x="216" y="392" width="100" height="8" rx="4" fill="#D9DCF2"/>
  <rect x="420" y="376" width="48" height="18" rx="9" fill="#DCE0FF"/>

  <!-- row 3 (pending, highlighted) -->
  <rect x="152" y="428" width="336" height="56" rx="20" fill="#FFF3EC"/>
  <circle cx="186" cy="456" r="15" fill="none" stroke="#FF9A7A" stroke-width="3.5"/>
  <rect x="216" y="447" width="150" height="10" rx="5" fill="#F3C3AD"/>
  <rect x="216" y="464" width="80" height="8" rx="4" fill="#F9DDCF"/>
  <rect x="420" y="448" width="48" height="18" rx="9" fill="url(#warm)"/>

  <!-- floating progress ring -->
  <g filter="url(#shadowSm)">
    <circle cx="610" cy="400" r="78" fill="#FFFFFF"/>
  </g>
  <circle cx="610" cy="400" r="50" fill="none" stroke="#EEF0FF" stroke-width="14"/>
  <circle cx="610" cy="400" r="50" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="235 314" transform="rotate(-90 610 400)"/>
  <circle cx="610" cy="400" r="14" fill="url(#warm)"/>

  <!-- floating bell chip -->
  <g filter="url(#shadowSm)">
    <rect x="86" y="96" width="92" height="92" rx="28" fill="#FFFFFF"/>
  </g>
  <path d="M132 120 a16 16 0 0 1 16 16 v14 l8 10 h-48 l8 -10 v-14 a16 16 0 0 1 16 -16z" fill="url(#accent)"/>
  <circle cx="132" cy="170" r="6" fill="url(#accent)"/>
  <circle cx="152" cy="122" r="7" fill="url(#warm)"/>
</svg>
