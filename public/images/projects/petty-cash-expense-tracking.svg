<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF0FF"/>
      <stop offset="1" stop-color="#FDEBE3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C7BFF"/>
      <stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB38A"/>
      <stop offset="1" stop-color="#FF8F8F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5A5FA8" flood-opacity="0.2"/>
    </filter>
    <filter id="shadowSm" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#5A5FA8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="690" cy="70" r="150" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="90" cy="540" r="130" fill="#FFFFFF" opacity="0.4"/>

  <!-- donut card (back) -->
  <g filter="url(#shadowSm)">
    <rect x="460" y="70" width="240" height="220" rx="32" fill="#FFFFFF" opacity="0.95"/>
  </g>
  <g transform="rotate(-90 580 160)">
    <circle cx="580" cy="160" r="52" fill="none" stroke="#EEF0FF" stroke-width="24"/>
    <circle cx="580" cy="160" r="52" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round" stroke-dasharray="130 197"/>
    <circle cx="580" cy="160" r="52" fill="none" stroke="#C7B8FF" stroke-width="24" stroke-linecap="round" stroke-dasharray="70 257" stroke-dashoffset="-142"/>
    <circle cx="580" cy="160" r="52" fill="none" stroke="url(#warm)" stroke-width="24" stroke-linecap="round" stroke-dasharray="40 287" stroke-dashoffset="-226"/>
  </g>
  <circle cx="580" cy="160" r="12" fill="#F5F6FF"/>
  <!-- legend -->
  <g>
    <circle cx="510" cy="252" r="7" fill="url(#accent)"/><rect x="524" y="248" width="30" height="8" rx="4" fill="#D9DCF2"/>
    <circle cx="582" cy="252" r="7" fill="#C7B8FF"/><rect x="596" y="248" width="30" height="8" rx="4" fill="#D9DCF2"/>
    <circle cx="652" cy="252" r="7" fill="url(#warm)"/>
  </g>

  <!-- receipt -->
  <g transform="rotate(-4 285 300)">
    <g filter="url(#shadow)">
      <path d="M194 60 H376 a24 24 0 0 1 24 24 V510
        L388.5 526 L377 510 L365.5 526 L354 510 L342.5 526 L331 510 L319.5 526 L308 510
        L296.5 526 L285 510 L273.5 526 L262 510 L250.5 526 L239 510 L227.5 526 L216 510
        L204.5 526 L193 510 L181.5 526 L170 510 V84 a24 24 0 0 1 24 -24 z" fill="#FFFFFF"/>
    </g>
    <!-- header -->
    <circle cx="212" cy="116" r="20" fill="url(#accent)"/>
    <circle cx="212" cy="116" r="7" fill="#FFFFFF" opacity="0.9"/>
    <rect x="246" y="104" width="92" height="13" rx="6.5" fill="#2B2D42"/>
    <rect x="246" y="125" width="60" height="9" rx="4.5" fill="#D9DCF2"/>
    <line x1="198" y1="160" x2="372" y2="160" stroke="#D9DCF2" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>

    <!-- items -->
    <circle cx="206" cy="192" r="6" fill="#6C7BFF"/>
    <rect x="224" y="187" width="84" height="10" rx="5" fill="#B9BEEA"/>
    <rect x="322" y="182" width="50" height="18" rx="9" fill="#DCE0FF"/>

    <circle cx="206" cy="232" r="6" fill="#C7B8FF"/>
    <rect x="224" y="227" width="64" height="10" rx="5" fill="#B9BEEA"/>
    <rect x="322" y="222" width="50" height="18" rx="9" fill="#DCE0FF"/>

    <circle cx="206" cy="272" r="6" fill="#FF9A7A"/>
    <rect x="224" y="267" width="96" height="10" rx="5" fill="#F3C3AD"/>
    <rect x="334" y="262" width="38" height="18" rx="9" fill="url(#warm)"/>

    <circle cx="206" cy="312" r="6" fill="#6C7BFF"/>
    <rect x="224" y="307" width="72" height="10" rx="5" fill="#B9BEEA"/>
    <rect x="322" y="302" width="50" height="18" rx="9" fill="#DCE0FF"/>

    <line x1="198" y1="350" x2="372" y2="350" stroke="#D9DCF2" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>

    <!-- total -->
    <rect x="198" y="374" width="64" height="12" rx="6" fill="#2B2D42"/>
    <rect x="306" y="366" width="66" height="28" rx="14" fill="url(#accent)"/>

    <!-- barcode -->
    <g fill="#C9CEF5">
      <rect x="198" y="428" width="5" height="46" rx="2"/><rect x="209" y="428" width="9" height="46" rx="2"/>
      <rect x="224" y="428" width="4" height="46" rx="2"/><rect x="234" y="428" width="7" height="46" rx="2"/>
      <rect x="247" y="428" width="4" height="46" rx="2"/><rect x="258" y="428" width="10" height="46" rx="2"/>
      <rect x="274" y="428" width="5" height="46" rx="2"/><rect x="285" y="428" width="4" height="46" rx="2"/>
      <rect x="295" y="428" width="9" height="46" rx="2"/><rect x="310" y="428" width="5" height="46" rx="2"/>
      <rect x="321" y="428" width="7" height="46" rx="2"/><rect x="334" y="428" width="4" height="46" rx="2"/>
      <rect x="344" y="428" width="9" height="46" rx="2"/><rect x="359" y="428" width="5" height="46" rx="2"/>
    </g>
    <!-- clip (supporting record) -->
    <rect x="336" y="38" width="20" height="50" rx="10" fill="none" stroke="url(#accent)" stroke-width="6"/>
  </g>

  <!-- link from receipt to vendor chip -->
  <path d="M399 282 C 435 282, 440 360, 474 360" fill="none" stroke="url(#accent)" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- vendor history chip -->
  <g filter="url(#shadowSm)">
    <rect x="470" y="326" width="220" height="68" rx="26" fill="#FFFFFF"/>
  </g>
  <rect x="488" y="344" width="32" height="32" rx="11" fill="url(#accent)"/>
  <circle cx="504" cy="360" r="7" fill="#FFFFFF" opacity="0.9"/>
  <rect x="534" y="346" width="76" height="10" rx="5" fill="#B9BEEA"/>
  <rect x="534" y="364" width="48" height="8" rx="4" fill="#D9DCF2"/>
  <circle cx="654" cy="360" r="16" fill="url(#warm)"/>
  <path d="M647 360 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- coin stack -->
  <g filter="url(#shadowSm)">
    <rect x="554" y="496" width="92" height="18" fill="#9B7BFF"/>
    <ellipse cx="600" cy="514" rx="46" ry="14" fill="#9B7BFF"/>
    <ellipse cx="600" cy="496" rx="46" ry="14" fill="#C7B8FF"/>
    <rect x="554" y="474" width="92" height="18" fill="#9B7BFF"/>
    <ellipse cx="600" cy="492" rx="46" ry="14" fill="#9B7BFF"/>
    <ellipse cx="600" cy="474" rx="46" ry="14" fill="#C7B8FF"/>
    <rect x="554" y="452" width="92" height="18" fill="#FF8F8F"/>
    <ellipse cx="600" cy="470" rx="46" ry="14" fill="#FF8F8F"/>
    <ellipse cx="600" cy="452" rx="46" ry="14" fill="#FFB38A"/>
  </g>
  <ellipse cx="600" cy="452" rx="26" ry="7" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>

  <!-- floating dots -->
  <circle cx="440" cy="40" r="9" fill="url(#accent)" opacity="0.85"/>
  <circle cx="750" cy="330" r="7" fill="url(#warm)" opacity="0.9"/>
  <circle cx="60" cy="200" r="6" fill="#B9BEEA"/>
  <circle cx="740" cy="520" r="14" fill="url(#warm)" opacity="0.9"/>
  <circle cx="740" cy="520" r="6" fill="#FFFFFF" opacity="0.7"/>
</svg>
