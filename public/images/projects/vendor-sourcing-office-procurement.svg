<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF0FF"/>
      <stop offset="1" stop-color="#FDEBE3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C7BFF"/>
      <stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB38A"/>
      <stop offset="1" stop-color="#FF8F8F"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5A5FA8" flood-opacity="0.2"/>
    </filter>
    <filter id="shadowSm" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#5A5FA8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="700" cy="80" r="150" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="80" cy="540" r="130" fill="#FFFFFF" opacity="0.4"/>

  <!-- orbit rings -->
  <circle cx="400" cy="300" r="140" fill="none" stroke="#D3D8F7" stroke-width="2.5" stroke-dasharray="3 12" stroke-linecap="round"/>
  <circle cx="400" cy="300" r="235" fill="none" stroke="#E0E3FA" stroke-width="2.5"/>

  <!-- connections -->
  <g stroke="#C9CEF5" stroke-width="3.5" stroke-linecap="round" fill="none">
    <line x1="400" y1="300" x2="215" y2="175"/>
    <line x1="400" y1="300" x2="600" y2="140"/>
    <line x1="400" y1="300" x2="150" y2="410"/>
    <line x1="400" y1="300" x2="400" y2="528"/>
  </g>
  <line x1="400" y1="300" x2="640" y2="410" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>

  <!-- center hub -->
  <g filter="url(#shadow)">
    <rect x="325" y="225" width="150" height="150" rx="44" fill="#FFFFFF"/>
  </g>
  <!-- cube -->
  <polygon points="400,262 436,282 400,302 364,282" fill="#B9A6FF"/>
  <polygon points="364,282 400,302 400,342 364,322" fill="#6C7BFF"/>
  <polygon points="436,282 400,302 400,342 436,322" fill="#8F7BFF"/>
  <polygon points="391,299 409,309 409,320 391,310" fill="#FFFFFF" opacity="0.0"/>
  <rect x="388" y="270" width="24" height="6" rx="3" fill="#FFFFFF" opacity="0.55" transform="rotate(26 400 273)"/>

  <!-- node 1: furniture (top-left) -->
  <g filter="url(#shadowSm)"><circle cx="215" cy="175" r="40" fill="#FFFFFF"/></g>
  <g fill="#6C7BFF">
    <rect x="200" y="155" width="9" height="24" rx="4.5"/>
    <rect x="200" y="172" width="32" height="9" rx="4.5"/>
    <rect x="200" y="181" width="6" height="14" rx="3"/>
    <rect x="226" y="181" width="6" height="14" rx="3"/>
  </g>

  <!-- node 2: services (top-right) -->
  <g filter="url(#shadowSm)"><circle cx="600" cy="140" r="34" fill="#FFFFFF"/></g>
  <g transform="translate(600 140) rotate(45)">
    <rect x="-4" y="-4" width="8" height="26" rx="4" fill="#9B7BFF"/>
    <circle cx="0" cy="-10" r="10" fill="#9B7BFF"/>
    <rect x="-4" y="-24" width="8" height="12" fill="#FFFFFF"/>
  </g>

  <!-- node 3: IT / equipment (left) -->
  <g filter="url(#shadowSm)"><circle cx="150" cy="410" r="36" fill="#FFFFFF"/></g>
  <rect x="134" y="394" width="32" height="21" rx="5" fill="none" stroke="#6C7BFF" stroke-width="4.5"/>
  <rect x="128" y="421" width="44" height="6" rx="3" fill="#6C7BFF"/>

  <!-- node 4: selected delivery vendor -->
  <g filter="url(#shadowSm)"><circle cx="640" cy="410" r="46" fill="#FFFFFF"/></g>
  <circle cx="640" cy="410" r="46" fill="none" stroke="url(#warm)" stroke-width="5"/>
  <rect x="617" y="397" width="28" height="22" rx="5" fill="url(#warm)"/>
  <path d="M645 403 h10 l8 9 v7 h-18z" fill="#FF9F85"/>
  <circle cx="627" cy="423" r="5" fill="#FFFFFF" stroke="#FF8F8F" stroke-width="3"/>
  <circle cx="654" cy="423" r="5" fill="#FFFFFF" stroke="#FF8F8F" stroke-width="3"/>
  <!-- check badge -->
  <circle cx="672" cy="376" r="16" fill="url(#accent)" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M665 376 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- node 5: supplies (bottom) -->
  <g filter="url(#shadowSm)"><circle cx="400" cy="528" r="32" fill="#FFFFFF"/></g>
  <path d="M400 508 c2 10 6 14 16 16 c-10 2 -14 6 -16 16 c-2 -10 -6 -14 -16 -16 c10 -2 14 -6 16 -16z" fill="#9B7BFF"/>

  <!-- quote chip near selected vendor -->
  <g filter="url(#shadowSm)">
    <rect x="520" y="480" width="150" height="56" rx="22" fill="#FFFFFF"/>
  </g>
  <circle cx="552" cy="508" r="13" fill="url(#warm)"/>
  <rect x="574" y="496" width="64" height="9" rx="4.5" fill="#D9DCF2"/>
  <rect x="574" y="512" width="40" height="9" rx="4.5" fill="#F3C3AD"/>

  <!-- rating chip near node 1 -->
  <g filter="url(#shadowSm)">
    <rect x="90" y="240" width="112" height="46" rx="23" fill="#FFFFFF"/>
  </g>
  <g fill="url(#warm)"><circle cx="120" cy="263" r="8"/><circle cx="146" cy="263" r="8"/><circle cx="172" cy="263" r="8"/></g>

  <!-- tiny floating dots -->
  <circle cx="300" cy="80" r="9" fill="url(#accent)" opacity="0.85"/>
  <circle cx="740" cy="270" r="7" fill="url(#warm)" opacity="0.9"/>
  <circle cx="60" cy="320" r="6" fill="#B9BEEA"/>
</svg>
